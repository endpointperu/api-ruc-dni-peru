name: Error en un ejemplo
description: Un ejemplo no compila, no se ejecuta o devuelve algo inesperado.
title: "[Lenguaje] Descripción breve"
labels: [error]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **No pegues tu API key** ni datos personales (nombres, DNI). Si necesitas un dato de prueba, usa el RUC 20131312955.
  - type: dropdown
    id: lenguaje
    attributes:
      label: Lenguaje
      options: [Bash/cURL, PowerShell, JavaScript, TypeScript, Python, PHP, Java, Kotlin, C#, VB.NET, Go, Rust, Ruby, Swift, Dart, C, C++, Visual FoxPro, Delphi, VBA (Excel), Google Apps Script, R, Perl, Lua, Scala, Elixir, OpenAPI, Postman, Otro]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión del lenguaje y sistema operativo
      placeholder: "PHP 8.2 en Windows 11 / Node 20 en Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: comando
    attributes:
      label: Comando ejecutado
      render: shell
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida obtenida (completa, sin la API key)
      render: shell
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
