name: Proponer un lenguaje o integración
description: Quieres un ejemplo en otro lenguaje, framework o herramienta.
title: "Ejemplo en …"
labels: [propuesta]
body:
  - type: input
    id: lenguaje
    attributes:
      label: Lenguaje, framework o herramienta
      placeholder: "Clojure, Laravel, n8n, Power Automate…"
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Para qué lo usarías
      description: Nos ayuda a priorizar. Si quieres escribirlo tú, dilo aquí y lee CONTRIBUTING.md.
